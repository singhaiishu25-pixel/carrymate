<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CarryMate POC</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f5f7fb}.hero{background:linear-gradient(135deg,#4f46e5,#2563eb);color:#fff;padding:70px 20px;text-align:center}.card{border:none;border-radius:16px;box-shadow:0 8px 20px rgba(0,0,0,.08)}footer{background:#111827;color:#fff;padding:20px;text-align:center;margin-top:40px}</style></head><body><section class='hero'><h1>🚆 CarryMate</h1><p>Earn while you travel by carrying verified small parcels.</p></section><div class='container my-5'><div class='card p-4'><h3 class='text-center mb-4'>Travel Partner Registration</h3><form id='carrymateForm'><div class='row g-3'><div class='col-md-6'><label>Full Name</label><input class='form-control' name='name' required></div><div class='col-md-6'><label>Mobile</label><input class='form-control' name='mobile' required></div><div class='col-md-6'><label>Email</label><input class='form-control' name='email'></div><div class='col-md-6'><label>Frequency</label><select class='form-select' name='frequency'><option>Daily</option><option>Weekly</option><option>Twice a Month</option><option>Monthly</option><option>Occasionally</option></select></div><div class='col-md-6'><label>Travelling From</label><input class='form-control' name='from'></div><div class='col-md-6'><label>Travelling To</label><input class='form-control' name='to'></div><div class='col-md-6'><label>Travel Date</label><input type='date' class='form-control' name='travelDate'></div><div class='col-md-6'><label>Capacity</label><select class='form-select' name='capacity'><option>Documents Only</option><option>Small Parcel (Up to 500 g)</option><option>Up to 1 kg</option><option>Up to 2 kg</option><option>Up to 5 kg</option><option>Up to 10 kg</option></select></div><div class='col-12'><button id='btn' class='btn btn-primary w-100'>Register Now</button></div></div></form></div></div><footer>©2026 CarryMate</footer><script>const URL='https://script.google.com/macros/s/AKfycbzdOSxCTUDsAkUGpvLzhQ8kx33rujeKaaRXQhvwrkDE0uB3IODlyCWsklO6MRq_7NKz5g/exec';document.getElementById('carrymateForm').addEventListener('submit',async e=>{e.preventDefault();const f=e.target,b=document.getElementById('btn');b.disabled=true;b.innerText='Submitting...';const d={name:f.name.value,mobile:f.mobile.value,email:f.email.value,frequency:f.frequency.value,from:f.from.value,to:f.to.value,travelDate:f.travelDate.value,capacity:f.capacity.value};try{await fetch(URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});alert('Thank you for registering with CarryMate!');f.reset();}catch(err){alert('Submission failed');console.log(err)}b.disabled=false;b.innerText='Register Now';});</script></body></html>
